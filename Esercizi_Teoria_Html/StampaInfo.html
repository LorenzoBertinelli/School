<!DOCTYPE html>
<html lang="it">
<head>
<title>Form</title>
<script>

        function mostraMessaggio() {

            var nome = document.getElementById('nome').value;

            var messaggio = document.getElementById('messaggio').value;

            alert("Nome: " + nome + "\nMessaggio: " + messaggio);

        }
</script>
</head>
<body>
<h1>Form con Nome e Messaggio</h1>
<form>

        Nome: <input type="text" id="nome"><br><br>

        Messaggio: <textarea id="messaggio"></textarea><br><br>
<input type="button" value="Invia" onclick="mostraMessaggio()">
</form>
</body>
</html>
